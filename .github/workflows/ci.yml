name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Typecheck das libs e do sandbox
        run: |
          pnpm exec tsc -b --pretty false
          pnpm --filter @workspace/mockup-sandbox typecheck

      # Já falha no main, fora dos arquivos deste lote: front (nomes soltos no Admin),
      # API (tipos de pedido/reenvio) e scripts (rootDir). O passo roda e não bloqueia.
      - name: Typecheck do front, da API e dos scripts (erros já existentes)
        continue-on-error: true
        run: |
          pnpm --filter @workspace/ka-imports typecheck
          pnpm --filter @workspace/api-server typecheck
          pnpm --filter @workspace/scripts typecheck

      - name: Testes
        run: pnpm test
        env:
          CHECKOUT_TOKEN_SECRET: test-checkout-token-secret

      - name: Audit crítico
        run: pnpm audit --audit-level=critical

      - name: Gitleaks só no diff
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          ./gitleaks detect --redact --no-banner --config .gitleaks.toml --log-opts="$range"
