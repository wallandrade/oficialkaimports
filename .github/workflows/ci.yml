name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.15.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Typecheck das libs e do sandbox
        run: |
          pnpm exec tsc -b --force --pretty false
          pnpm --filter @workspace/mockup-sandbox run typecheck

      - name: Typecheck do front, da API e dos scripts contra a baseline
        id: baseline
        run: node .github/check-typecheck-baseline.mjs

      - name: Testes
        if: always()
        run: pnpm test
        env:
          CHECKOUT_TOKEN_SECRET: test-checkout-token-secret

      - name: Audit high em produção
        if: always()
        run: pnpm audit --prod --audit-level=high

      - name: Gitleaks só no diff
        if: always()
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o "$archive" "$base/$archive"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}$" checksums.txt | sha256sum -c -
          tar -xzf "$archive" gitleaks
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          ./gitleaks detect --redact --no-banner --config .gitleaks.toml --log-opts="$range"
